<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" type="text/css" href="style.css">
  <title>Shuffle Music Player + Pomodoro Timer</title>

</head>
<body>
  <h1>🎵 Shuffle Music Player</h1>

  <!-- 🍅 Pomodoro Timer -->
  <div id="pomodoro">
    <h2>🍅 Pomodoro Timer</h2>
    <div id="timerDisplay">25:00</div>
    <div>
      <button class="pomodoro-btn" id="startBtn">Start</button>
      <button class="pomodoro-btn" id="pauseBtn">Pause</button>
      <button class="pomodoro-btn" id="resetBtn">Reset</button>
    </div>
    <p id="modeLabel">Focus Mode</p>
  </div>

  <!-- 🎧 Music Controls -->
   <div style="margin:10px 0;">
  <label for="playlistSelect">Playlist: </label>
  <select id="playlistSelect">
    <option value="tavern">Fantasy Tavern</option>
    <option value="videoGames">Indie Video Game</option>
    <option value="frenchCafe">Jazzy French Cafe</option>
    <option value="anotherMemory">Another Memory</option>
  </select>
</div>
  <div>
    <button id="prevBtn">⏮ Previous</button>
    <button id="nextBtn">⏭ Next</button>
  </div>
  <p id="nowPlaying">Now playing: —</p>
  <ul id="playlist"></ul>
  <audio id="audioPlayer" controls></audio>

  <script>
    // -----------------------------
    // 🍅 Pomodoro Timer Logic
    // -----------------------------
    const timerDisplay = document.getElementById("timerDisplay");
    const startBtn = document.getElementById("startBtn");
    const pauseBtn = document.getElementById("pauseBtn");
    const resetBtn = document.getElementById("resetBtn");
    const modeLabel = document.getElementById("modeLabel");

    let isFocus = true;
    let timeLeft = 25 * 60; // 25 min
    let timer = null;

    function updateTimerDisplay() {
      const minutes = Math.floor(timeLeft / 60).toString().padStart(2, "0");
      const seconds = (timeLeft % 60).toString().padStart(2, "0");
      timerDisplay.textContent = `${minutes}:${seconds}`;
    }

    function startTimer() {
      if (timer) return; // prevent multiple intervals
      timer = setInterval(() => {
        timeLeft--;
        updateTimerDisplay();

        if (timeLeft <= 0) {
          clearInterval(timer);
          timer = null;

          // Switch mode
          if (isFocus) {
            isFocus = false;
            timeLeft = 5 * 60; // 5 minutes break
            modeLabel.textContent = "Break Time 🌿";
          } else {
            isFocus = true;
            timeLeft = 25 * 60; // Back to focus
            modeLabel.textContent = "Focus Mode 🔥";
          }

          updateTimerDisplay();
          startTimer(); // auto-start next phase
        }
      }, 1000);
    }

    function pauseTimer() {
      clearInterval(timer);
      timer = null;
    }

    function resetTimer() {
      pauseTimer();
      isFocus = true;
      timeLeft = 25 * 60;
      modeLabel.textContent = "Focus Mode 🔥";
      updateTimerDisplay();
    }

    startBtn.addEventListener("click", startTimer);
    pauseBtn.addEventListener("click", pauseTimer);
    resetBtn.addEventListener("click", resetTimer);
    updateTimerDisplay();

    // -----------------------------
    // 🎵 Music Player Logic
    // -----------------------------
    const playlists = {
  tavern: [
    "songs/Dirty Paws - Of Monsters And Men.mp3",
    "songs/Come Along - Cosmo Sheldrake.mp3",
    "songs/Hammer And The Anvil - The Longest Johns.mp3",
    "songs/Little Dark Age - MGMT (Bardcore Version).mp3",
    "songs/Pierre - Ryn Weaver.mp3",
    "songs/Soldier, Poet, King - The Oh Hellos.mp3",
    "songs/Song of the Vikings (My Mother Told Me) - Perly I Lotry.mp3",
    "songs/Tardigrade Song - Cosmo Sheldrake.mp3",
    "songs/The Curse - Agnes Obel.mp3",
    "songs/The Moon Will Sing - The Crane Wives.mp3",
    "songs/The Moss - Cosmo Sheldrake.mp3",
    "songs/The Wolf - Phildel.mp3",
    "songs/Toss A Coin To Your Witcher - Joey Batey.mp3",
    "songs/Werewolf - Fiona Apple.mp3",
    "songs/Witches - Alice Phoebe Lou.mp3"
  ],
  videoGames: [
    "vgSongs/Hollow Knight OST - Enter Hallownest.mp3",
    "songs/break2.mp3"
  ],
  frenchCafe: [
    "fcSongs/Pink Martini - Sympathique [HD].mp3",
    "songs/tavern2.mp3"
  ],
  anotherMemory: [
    "amSongs/505.mp3",
    "amSongs/Apocalypse.mp3",
    "amSongs/Are You Bored Yet.mp3",
    "amSongs/Best Friend.mp3",
    "amSongs/Can I Call You Tonight.mp3",
    "amSongs/Crush Culture.mp3",
    "amSongs/cynical fairytale.mp3",
    "amSongs/Do I Wanna Know.mp3",
    "amSongs/Fool.mp3",
    "amSongs/Freaks.mp3",
    "amSongs/Good Luck, Babe!.mp3",
    "amSongs/I Can't Handle Change.mp3",
    "amSongs/I Want To Be With You.mp3",
    "amSongs/It's U.mp3",
    "amSongs/Juliet.mp3",
    "amSongs/Linger.mp3",
    "amSongs/Meet Met At Our Spot.mp3",
    "amSongs/Monster.mp3",
    "amSongs/Mr. Loverman.mp3",
    "amSongs/Never Love an Anchor.mp3",
    "amSongs/Sleeping With A Friend.mp3",
    "amSongs/Somewhere Only We Know.mp3",
    "amSongs/Sports.mp3",
    "amSongs/Strawberry Blonde.mp3",
    "amSongs/Summertime.mp3",
    "amSongs/Sweater Weather.mp3",
    "amSongs/Sweet Tooth.mp3",
    "amSongs/The Fall.mp3",
    "amSongs/The World Is Ugly.mp3",
    "amSongs/This Side of Paradise.mp3",
    "amSongs/Tongue Tied.mp3",
    "amSongs/Too Sweet.mp3",
    "amSongs/Video Games.mp3",
    "amSongs/Zelda's Lullaby.mp3",
  ]
};

let currentPlaylistName = "tavern";
let songs = playlists[currentPlaylistName];

    const playlistElement = document.getElementById("playlist");
    const audioPlayer = document.getElementById("audioPlayer");
    const nowPlaying = document.getElementById("nowPlaying");
    const nextBtn = document.getElementById("nextBtn");
    const prevBtn = document.getElementById("prevBtn");

    let shuffled = [];
    let currentIndex = 0;

    function shuffleArray(array) {
      let shuffled = array.slice();
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    function renderPlaylist() {
      playlistElement.innerHTML = "";
      shuffled.forEach((song, index) => {
        const li = document.createElement("li");
        li.textContent = song.split("/").pop();
        li.addEventListener("click", () => playTrack(index));
        if (index === currentIndex) li.classList.add("playing");
        playlistElement.appendChild(li);
      });
    }

    function playTrack(index) {
      currentIndex = index;
      const song = shuffled[currentIndex];
      audioPlayer.src = song;
      audioPlayer.play();

      nowPlaying.textContent = "Now playing: " + song.split("/").pop();
      document.querySelectorAll("li").forEach(li => li.classList.remove("playing"));
      document.querySelectorAll("li")[currentIndex].classList.add("playing");
    }

    function nextTrack() {
      currentIndex++;
      if (currentIndex >= shuffled.length) {
        shuffled = shuffleArray(songs);
        currentIndex = 0;
      }
      playTrack(currentIndex);
    }

    function prevTrack() {
      currentIndex--;
      if (currentIndex < 0) currentIndex = shuffled.length - 1;
      playTrack(currentIndex);
    }

    audioPlayer.addEventListener("ended", nextTrack);
    nextBtn.addEventListener("click", nextTrack);
    prevBtn.addEventListener("click", prevTrack);

    shuffled = shuffleArray(songs);
    renderPlaylist();
    // Change playlist when user selects a new one
const playlistSelect = document.getElementById("playlistSelect");
playlistSelect.addEventListener("change", (e) => {
  currentPlaylistName = e.target.value;
  songs = playlists[currentPlaylistName];
  shuffled = shuffleArray(songs);
  currentIndex = 0;
  renderPlaylist();
  playTrack(0);
});
    playTrack(0);
  </script>
</body>
</html>
